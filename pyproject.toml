[project]
name = "halcyon"
version = "0.1.0"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "chromadb>=0.5",
    "mcp>=1.28.1",
    "langgraph>=1.2.9",
    "litellm>=1.94.0",
]

[project.optional-dependencies]
# Deliberately vulnerable, and deliberately OPTIONAL. Ray 2.51.0 carries
# CVE-2025-62593, which CISA added to its Known Exploited Vulnerabilities
# catalogue on 2026-08-17. It is here so a scanner has an actively-exploited CVE
# to find in this repository. `uv sync` does NOT install extras by default, so
# running Halcyon does not pull Ray.
vulnerable-demo = ["ray==2.51.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
